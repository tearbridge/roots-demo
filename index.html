<style>
:root{--paper:#f3ead8;--ink:#2b2118;--muted:#7a6a55;--red:#a8322a;--line:#cdbb98}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
#map{position:absolute;inset:0;background:#efe4cc}
.leaflet-container{background:#efe4cc;font-family:inherit}
#top{position:absolute;top:0;left:0;right:0;z-index:1000;padding:10px 12px calc(8px);background:linear-gradient(#f3ead8ee,#f3ead800);pointer-events:none}
#top h1{margin:0;font-size:18px;letter-spacing:.05em}
#top .sub{font-size:12px;color:var(--muted)}
#layers{position:absolute;top:56px;right:10px;z-index:1000;background:#fbf6eaee;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px}
#layers label{display:block;margin:3px 0;white-space:nowrap}
#legend{position:absolute;top:56px;left:10px;z-index:1000;background:#fbf6eaee;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:11px;line-height:1.6}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:#fbf6ea;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom));max-height:42vh;overflow:auto}
#sheet .era{font-size:12px;color:var(--red);letter-spacing:.1em}
#sheet h2{margin:2px 0 6px;font-size:18px}
#sheet p{margin:6px 0;font-size:14px;line-height:1.65}
#sheet .src{font-size:12px;color:var(--muted)}
#nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
#nav button{border:1px solid var(--ink);background:none;border-radius:16px;padding:5px 14px;font-size:14px;color:var(--ink)}
#nav button:disabled{opacity:.3}
#dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin:0 3px}
#dots span.on{background:var(--red)}
.lbl{font-size:12px;color:#8a7556;letter-spacing:.3em;white-space:nowrap;text-shadow:0 0 3px #efe4cc}
.city{font-size:11px;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff}
.city.key{color:var(--red);font-weight:700;font-size:12px}
.hao{background:var(--red);color:#fff;border-radius:3px;font-size:13px;font-weight:700;text-align:center;line-height:22px;box-shadow:0 0 0 2px #fbf6ea}
.leaflet-popup-content{font-size:13px;line-height:1.6;margin:10px 12px}
.leaflet-popup-content b{font-size:14px}
.tag{font-size:11px;border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:4px}
.tA{color:#2e6b3a}.tB{color:#b8892f}.tC{color:#8a7a6a}
.q{color:var(--red);font-weight:700}
table.card{border-collapse:collapse;margin:4px 0}
table.card td{padding:2px 8px 2px 0;font-size:13px;border-bottom:1px dashed var(--line)}
</style>
</head>
<body>
<div id="map"></div>
<div id="top"><h1>郝家从哪里来</h1><div class="sub">赵县泥沟村 · 试作版 · 地图可拖动、缩放，点地图上的点看出处</div></div>
<div id="legend">
  <div><i style="background:#2e6b3a"></i>明代以前已有</div>
  <div><i style="background:#a8322a"></i>明初山西迁来</div>
  <div><i style="background:#b8892f"></i>永乐屯垦建村</div>
  <div><i style="background:#4f6d8a"></i>明代本地形成</div>
  <div><i style="background:#fff;border:1px solid #999"></i>尚未整理</div>
</div>
<div id="layers">
  <label><input type="checkbox" data-l="flows" checked> 迁民路线</label>
  <label><input type="checkbox" data-l="pilot" checked> 已整理的村</label>
  <label><input type="checkbox" data-l="others" checked> 未整理的村</label>
  <label><input type="checkbox" data-l="hao" checked> 郝姓记录</label>
</div>
<div id="sheet">
  <div class="era" id="era"></div>
  <h2 id="ttl"></h2>
  <div id="body"></div>
  <div id="nav"><button id="prev">上一步</button><span id="dots"></span><button id="next">下一步</button></div>
</div>

 {era:"1167 年以前",ttl:"赵县早就有村子",body:`<p>金大定七年（1167）《大金沃州柏林禅院三千邑众碑记》记有董村、堰头村等村名。固城村是西汉平棘县治，前 174 年置县。</p><p>已整理的 24 个村里，11 个（绿色）明代以前就有。</p><p class="src">点地图上的点可以看每个村的依据和可信度。</p>`,
  view:ZX,flows:[],show:["pre_ming"],shade:false,hao:false},
 {era:"元末 — 洪武 · 1350–1398",ttl:"山西往外迁民",body:`<p>元末战乱、灾荒之后，华北人口大减。洪武年间，朝廷多次从山西迁民到今河北、山东、河南屯垦。学者估计明初山西迁出约百万人。</p><p>河北枣强是二次分发点，山东北部很多村记载「自枣强迁来」。</p><p class="src">出处：曹树基《中国移民史·明时期》；各县地名资料（点城市看）</p>`,
  view:NORTH,flows:["hongwu"],show:[],shade:false,hao:false},
 {era:"1399–1402",ttl:"靖难之役",body:`<p>燕王朱棣起兵夺位，战事主要在今河北、山东一带，打了四年。河北民间说的「燕王扫北」指的就是这件事。</p><p>定县的社会调查里，多数村都说自己是燕王扫北后从山西洪洞迁来的。</p><p class="src">出处：李景汉《定县社会概况调查》</p>`,
  view:NORTH,flows:[],show:[],shade:true,hao:false},
 {era:"永乐 · 1403–1424",ttl:"迁到北京周边和赵县",body:`<p>永乐年间继续迁民，重点充实北京周边。赵县这一时期有移民迁入，也有军队屯垦建村。</p><p>《赵州乡土志》记卜氏「明永乐年间，自山西洪洞县迁至郡西卜家庄」。已整理的村里，红色 5 个是山西迁来，黄色 4 个是屯垦建村。</p><p class="src">出处：清光绪《赵州乡土志》；80 年代赵县村名资料</p>`,
  view:NORTH,flows:["yongle"],show:["hongdong_min","tunken"],shade:false,hao:false,then:ZX},
 {era:"今天",ttl:"泥沟村 · 郝家",body:`<p>泥沟村属韩村镇，村名来历还没查到。</p><p>郝姓线索：传统说法郡望「太原郝氏」；新河县宋亮村记有郝姓明初自洪洞迁来；山东《重修莒志》记「洪洞县孝义村郝氏，元末迁至城西粟园」。</p><p>家里的族谱能确认：始祖、从哪个县哪个村迁来、哪一年、字辈。点「郝」看。</p>`,
  view:[[37.45,114.55],[37.95,115.40]],flows:[],show:"all",shade:false,hao:true},
 {era:"自由浏览",ttl:"全部图层",body:`<p>所有图层都已打开。白点是赵县还没整理来历的村（${VIL.others.length} 个），要把它们填上，需要 1984 年的《赵县地名资料汇编》。</p><p class="src">右上角可以开关图层。</p>`,
  view:NORTH,flows:["hongwu","yongle"],show:"all",shade:false,hao:true}
];
let cur=0;
function go(i){
  cur=i;const c=CH[i];
  document.getElementById("era").textContent=c.era;document.getElementById("ttl").textContent=c.ttl;document.getElementById("body").innerHTML=c.body;
  document.getElementById("prev").disabled=i===0;document.getElementById("next").disabled=i===CH.length-1;
  document.getElementById("dots").innerHTML=CH.map((_,j)=>`<span class="${j===i?"on":""}"></span>`).join("");
  setFlows(c.flows);
  pilotMarkers.forEach(m=>{const vis=c.show==="all"||c.show.includes(m.cat)||(i===0&&false);m.setStyle({fillOpacity:vis?1:.15,opacity:vis?1:.15});});
  c.shade?hebeiShade.addTo(map):map.removeLayer(hebeiShade);
  c.hao?haoLine.addTo(map):map.removeLayer(haoLine);
  document.querySelector('#layers input[data-l="hao"]').checked=!!c.hao;sync();
  map.closePopup();
  map.flyToBounds(c.view,{paddingTopLeft:[20,60],paddingBottomRight:[20,document.getElementById("sheet").offsetHeight+10],duration:1.2});
  if(c.then) setTimeout(()=>{if(cur===i)map.flyToBounds(c.then,{paddingTopLeft:[20,60],paddingBottomRight:[20,document.getElementById("sheet").offsetHeight+10],duration:1.4});},3200);
  if(i===4) setTimeout(()=>{if(cur===i)ngMarker.openPopup();},1400);
}
document.getElementById("prev").onclick=()=>go(Math.max(0,cur-1));
document.getElementById("next").onclick=()=>go(Math.min(CH.length-1,cur+1));
go(Math.min(CH.length-1,parseInt(location.hash.slice(1))||0));
</script>
